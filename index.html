<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Salma Megdiche — Architecte d'intérieur</title>
<meta name="description" content="Salma Megdiche, architecte d'intérieur à Paris. Résidentiel, showrooms et vitrines, home staging, scénographie d'événements.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --plaster:#F4F2EC; --plaster-2:#E9E6DE; --lin:#EFE7D8;
  --glaze:#25302B; --stone:#8A8781;
  --sauge:#6E8F80; --ocre:#D5B26F; --argile:#C6968A; --amethyste:#8C81A0; --laiton:#B39A62;
  --grout:7px; --gutter:clamp(20px,5vw,72px); --measure:60ch;
  --font:"Jost","Futura","Avenir Next","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto} *{transition:none!important}}
body{margin:0;background:var(--plaster);color:var(--glaze);font-family:var(--font);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased;position:relative}
/* grain d'enduit très léger sur toute la page */
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.045;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
main,header,footer{position:relative;z-index:1}
a{color:inherit;text-decoration:none} a:hover{color:var(--sauge)}
:focus-visible{outline:2px solid var(--sauge);outline-offset:3px}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
h1,h2,h3{font-weight:300;margin:0;letter-spacing:-.01em} p{margin:0}

/* en-tête */
.site-head{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--plaster) 90%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--plaster-2)}
.site-head .row{display:flex;align-items:center;justify-content:space-between;padding:18px var(--gutter);gap:24px}
.brand{font-weight:500;white-space:nowrap} .brand small{display:block;font-weight:300;color:var(--stone);font-size:.85em;margin-top:2px}
nav ul{list-style:none;margin:0;padding:0;display:flex;gap:28px;align-items:center} nav a{font-size:.95em}
.lang{display:inline-flex;border:1px solid var(--plaster-2);border-radius:999px;overflow:hidden}
.lang button{padding:5px 12px;font-size:.85em;color:var(--stone)} .lang button[aria-pressed="true"]{background:var(--glaze);color:var(--plaster)}
.lang[hidden]{display:none}
@media(max-width:760px){nav ul{gap:16px} nav a{font-size:.9em} .brand small{display:none}}
@media(max-width:600px){nav li:not(.lang){display:none}}

/* ---------- héros : la planche d'inspiration ---------- */
.board{padding:28px var(--gutter) 0;display:grid;grid-template-columns:7fr 5fr;gap:var(--grout);align-items:stretch}
.board .main{position:relative;aspect-ratio:4/3;overflow:hidden;border-radius:999px 999px 0 0;background:#D9D5CB}
.board .main img,.board .small img{width:100%;height:100%;object-fit:cover;display:block}
.board .side{display:grid;grid-template-rows:auto 1fr auto;gap:var(--grout)}
.board .top{display:grid;grid-template-columns:1fr 1fr 1.6fr;gap:var(--grout)}
.board .sw{aspect-ratio:1;background-size:cover;background-position:center;position:relative;border-radius:2px}
.board .small{aspect-ratio:1.6;position:relative;overflow:hidden;background:#CFD6CF}
.board .text{padding:26px 8px 18px 0;display:flex;flex-direction:column;justify-content:center}
.board h1{font-size:clamp(28px,3.2vw,40px);line-height:1.12}
.board .text p{margin-top:14px;color:var(--stone);font-weight:300;font-size:clamp(16px,1.25vw,19px);max-width:34ch}
.board .bottom{display:flex;gap:18px;align-items:flex-end;padding-bottom:6px}
.board .dot{width:58px;height:58px;border-radius:50%;background-size:cover;background-position:center;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.board .lbl{font-size:.78em;color:var(--stone);font-weight:300;margin-top:6px;line-height:1.2}
.illu{position:absolute;left:10px;bottom:10px;font-size:.7em;font-weight:300;letter-spacing:.02em;color:#fff;background:rgba(37,48,43,.55);padding:3px 8px;border-radius:2px}
.ph{position:absolute;inset:0;display:grid;place-items:end start;padding:12px;color:var(--stone);font-size:.78em;font-weight:300}
@media(max-width:900px){
  .board{grid-template-columns:1fr}
  .board .main{aspect-ratio:4/5;border-radius:999px 999px 0 0}
  .board .side{grid-template-rows:auto auto auto}
}

/* sections */
section{padding:76px var(--gutter) 0}
.section-title{font-size:clamp(22px,2.4vw,30px);margin-bottom:26px}

/* domaines : quatre colonnes, chacune portée par sa couleur */
.domains{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--grout);background:var(--plaster-2);margin-top:8px}
.domains > div{background:var(--plaster);padding:18px 22px 26px 0;border-top:3px solid var(--c)}
.domains h3{font-size:1.05em;font-weight:500;margin-bottom:8px}
.domains p{color:var(--stone);font-weight:300;font-size:.95em;max-width:34ch}
@media(max-width:900px){.domains{grid-template-columns:repeat(2,1fr)} .domains>div{padding-right:18px}}
@media(max-width:520px){.domains{grid-template-columns:1fr}}

/* projets : mosaïque de carreaux */
.filters{display:flex;flex-wrap:wrap;gap:6px 22px;margin-bottom:26px}
.filters button{padding:4px 0;color:var(--stone);border-bottom:1px solid transparent;font-size:.95em;display:inline-flex;align-items:center;gap:8px}
.filters button[aria-pressed="true"]{color:var(--glaze);border-bottom-color:var(--glaze)}
.chip{width:10px;height:10px;border-radius:2px;background:var(--c);flex:none}
.grid{display:grid;grid-template-columns:repeat(6,1fr);grid-auto-rows:calc((100vw - 2*var(--gutter) - 5*var(--grout))/6 * .78);grid-auto-flow:dense;gap:var(--grout);background:var(--plaster-2)}
.tile{background:var(--plaster);text-align:left;display:flex;flex-direction:column;grid-column:span 2;grid-row:span 2}
.tile.wide{grid-column:span 4;grid-row:span 2}
.tile.tall{grid-column:span 2;grid-row:span 3}
.tile .img{flex:1;position:relative;overflow:hidden;background:var(--t)}
.tile .img img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.board .main,.board .small,.tile .img,.panel .gal > div{position:relative}
.tile:hover .img img{transform:scale(1.02)}
.tile .cap{padding:12px 12px 20px 0;display:flex;gap:10px;align-items:flex-start}
.tile .cap .chip{margin-top:8px}
.tile .cap b{font-weight:500;display:block} .tile .cap span{color:var(--stone);font-weight:300;font-size:.92em}
.tile .cap em{font-style:normal;color:var(--sauge);font-size:.8em;margin-left:8px}
.empty{padding:40px 0;color:var(--stone);font-weight:300}
@media(max-width:900px){.grid{grid-template-columns:repeat(4,1fr);grid-auto-rows:calc((100vw - 2*var(--gutter) - 3*var(--grout))/4 * .8)} .tile.wide{grid-column:span 4}}
@media(max-width:560px){.grid{grid-template-columns:1fr;grid-auto-rows:auto} .tile,.tile.wide,.tile.tall{grid-column:span 1;grid-row:span 1} .tile .img{aspect-ratio:4/3}}

/* panneau projet */
.backdrop{position:fixed;inset:0;background:rgba(37,48,43,.32);z-index:30;opacity:0;pointer-events:none;transition:opacity .25s}
.backdrop.on{opacity:1;pointer-events:auto}
.panel{position:fixed;top:0;right:0;height:100dvh;width:min(760px,100vw);background:var(--plaster);z-index:31;transform:translateX(100%);transition:transform .3s ease;overflow:auto}
.panel.on{transform:none}
.panel-in{padding:24px var(--gutter) 60px}
.panel .close{position:sticky;top:0;float:right;background:var(--plaster);padding:6px 0 6px 12px;color:var(--stone)}
.panel h2{font-size:clamp(24px,2.6vw,32px);margin:36px 0 6px;clear:both}
.panel .meta{color:var(--stone);font-weight:300;margin-bottom:24px;display:flex;gap:10px;align-items:center}
.panel .gal{display:grid;grid-template-columns:1fr 1fr;gap:var(--grout);background:var(--plaster-2);margin-bottom:28px}
.panel .gal > div{aspect-ratio:4/3;background:var(--t);position:relative;overflow:hidden}
.panel .gal > div:first-child{grid-column:span 2;aspect-ratio:16/10}
.panel .gal img{width:100%;height:100%;object-fit:cover}
.panel .desc{max-width:var(--measure);font-weight:300;font-size:1.05em}
.facts{list-style:none;padding:0;margin:28px 0 0;display:grid;grid-template-columns:1fr 1fr;gap:12px 24px;max-width:var(--measure)}
.facts li{border-top:1px solid var(--plaster-2);padding-top:8px} .facts li span{display:block;color:var(--stone);font-size:.85em;font-weight:300}

/* approche : bande lin, séquence numérotée */
.approche{margin-top:76px;padding:64px var(--gutter);background:var(--lin)}
.approche .section-title{margin-bottom:22px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:40px}
.steps .n{font-weight:300;color:var(--laiton);font-size:1.7em;line-height:1;margin-bottom:12px}
.steps h3{font-size:1.05em;font-weight:500;margin-bottom:8px}
.steps p{color:var(--stone);font-weight:300;font-size:.95em;max-width:34ch}
@media(max-width:760px){.steps{grid-template-columns:1fr;gap:26px}}

/* à propos */
.about{display:grid;grid-template-columns:minmax(220px,1fr) 2fr;gap:48px;align-items:start}
.portrait{aspect-ratio:4/5;background:#CBD3CC;position:relative;overflow:hidden}
.portrait img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.about .text{max-width:var(--measure);font-weight:300;font-size:1.05em} .about .text p + p{margin-top:16px}
.about dl{margin:28px 0 0;display:grid;grid-template-columns:auto 1fr;gap:8px 20px;font-size:.95em}
.about dt{color:var(--stone);font-weight:300} .about dd{margin:0}
@media(max-width:760px){.about{grid-template-columns:1fr} .portrait{max-width:300px}}

/* contact + pied de page sur fond émail */
.contact{margin-top:80px;padding:64px var(--gutter) 40px;background:var(--glaze);color:var(--plaster)}
.contact .box{display:grid;grid-template-columns:1fr 1fr;gap:32px;max-width:960px}
.contact .big{font-size:clamp(22px,2.2vw,30px);font-weight:300;line-height:1.3}
.contact ul{list-style:none;margin:0;padding:0;font-weight:300} .contact li{margin-bottom:8px}
.contact li a{border-bottom:1px solid rgba(244,242,236,.35)} .contact a:hover{color:var(--ocre)}
.contact .cv{display:inline-block;margin-top:16px;padding:10px 18px;border:1px solid var(--plaster);border-radius:999px;font-size:.95em}
.contact .cv:hover{background:var(--plaster);color:var(--glaze)}
.contact footer{margin-top:56px;padding-top:18px;border-top:1px solid rgba(244,242,236,.18);color:rgba(244,242,236,.6);font-size:.85em;font-weight:300;display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px}
@media(max-width:760px){.contact .box{grid-template-columns:1fr}}
</style>
</head>

/* ============================================================
   MÉCANIQUE — ne pas modifier en dessous
   ============================================================ */
let lang="fr", filter="all";
const $=s=>document.querySelector(s); const t=k=>CONTENT[lang][k];
const img=(src,alt="")=>src?`<img src="${src}" alt="${alt}">${ILLUSTRATION_MODE?`<span class="illu">Illustration provisoire</span>`:""}`:"";
const ph=k=>`<div class="ph">${t(k)}</div>`;

function render(){
  document.documentElement.lang=lang;
  $("#langToggle").hidden=!SHOW_LANGUAGE_TOGGLE;
  document.querySelectorAll("[data-i18n]").forEach(el=>el.textContent=t(el.dataset.i18n));
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===lang));
  $("#heroMain").innerHTML = HERO_IMAGE ? img(HERO_IMAGE) : ph("hero_ph");
  $("#heroSmall").innerHTML = HERO_SMALL_IMAGE ? img(HERO_SMALL_IMAGE) : ph("small_ph");
  $("#portrait").innerHTML = PORTRAIT_IMAGE ? img(PORTRAIT_IMAGE,"Salma Megdiche") : ph("portrait_ph");
  $("#dots").innerHTML = SWATCHES.map(s=>`<div><div class="dot" style="background-image:url(${s.img})"></div><div class="lbl">${s.label}</div></div>`).join("");
  $("#domains").innerHTML = t("domains").map(d=>`<div style="--c:${CATEGORIES[d.cat].color}"><h3>${d.t}</h3><p>${d.p}</p></div>`).join("");
  $("#steps").innerHTML = t("steps").map((s,i)=>`<div><div class="n">${i+1}</div><h3>${s.t}</h3><p>${s.p}</p></div>`).join("");
  $("#aboutText").innerHTML = t("about").map(p=>`<p>${p}</p>`).join("");
  $("#aboutFacts").innerHTML = t("facts").map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join("");
  const keys=["all",...Object.keys(CATEGORIES)];
  $("#filters").innerHTML = keys.map(k=>`<button data-f="${k}" aria-pressed="${filter===k}">${k==="all"?"":`<span class="chip" style="--c:${CATEGORIES[k].color}"></span>`}${k==="all"?t("all"):CATEGORIES[k][lang]}</button>`).join("");
  const shown=PROJECTS.filter(p=>filter==="all"||p.cat===filter);
  $("#grid").innerHTML = shown.map(p=>{const c=CATEGORIES[p.cat];return `
    <button class="tile ${p.size||""}" data-id="${p.id}" aria-haspopup="dialog" style="--t:${c.tint}">
      <div class="img">${p.images[0]?img(p.images[0]):ph("img_ph")}</div>
      <div class="cap"><span class="chip" style="--c:${c.color}"></span>
        <div><b>${p.title[lang]}${p.sample?`<em>${t("sample")}</em>`:""}</b><span>${c[lang]} — ${p.place}, ${p.year}</span></div></div>
    </button>`}).join("");
  $("#empty").hidden = shown.length>0;
}
function openPanel(id){
  const p=PROJECTS.find(x=>x.id===id); if(!p) return; const c=CATEGORIES[p.cat];
  $("#panelTitle").textContent=p.title[lang];
  $("#panelMeta").innerHTML=`<span class="chip" style="--c:${c.color}"></span>${c[lang]} — ${p.place}, ${p.year}`;
  const imgs=p.images.length?p.images:[null,null,null];
  $("#panelGal").innerHTML=imgs.map(s=>`<div style="--t:${c.tint}">${s?img(s):ph("img_ph")}</div>`).join("");
  $("#panelDesc").textContent=p.desc[lang];
  const facts=[[t("lbl_mission"),p.mission[lang]],[t("lbl_place"),p.place],[t("lbl_year"),p.year],[t("lbl_surface"),p.surface]].filter(f=>f[1]);
  $("#panelFacts").innerHTML=facts.map(([k,v])=>`<li><span>${k}</span>${v}</li>`).join("");
  $("#panel").classList.add("on"); $("#panel").setAttribute("aria-hidden","false");
  $("#backdrop").classList.add("on"); document.body.style.overflow="hidden"; $("#closePanel").focus();
}
function closePanel(){ $("#panel").classList.remove("on"); $("#panel").setAttribute("aria-hidden","true"); $("#backdrop").classList.remove("on"); document.body.style.overflow=""; }
document.addEventListener("click",e=>{
  const lb=e.target.closest("[data-lang]"); if(lb){lang=lb.dataset.lang;render();return;}
  const fb=e.target.closest("[data-f]");   if(fb){filter=fb.dataset.f;render();return;}
  const tile=e.target.closest(".tile");    if(tile){openPanel(tile.dataset.id);return;}
  if(e.target.closest("#closePanel")||e.target.id==="backdrop") closePanel();
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closePanel();});
render();
</script>
